<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock pages</title>
<link rel="stylesheet" href="assets/mock.css">
<style>
    body {
        background: #f4f5f7;
        color: #1f2933;
    }

    main {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 16px;
    }

    h1 {
        font-size: 22px;
        margin: 0 0 8px;
    }

    .lead {
        color: #52606d;
        margin: 0 0 28px;
    }

    .card {
        display: block;
        padding: 18px 20px;
        margin-bottom: 14px;
        border: 1px solid #d9dee4;
        border-radius: 8px;
        background: #fff;
        color: inherit;
        text-decoration: none;
    }

    .card:hover {
        border-color: #7b8794;
    }

    .card strong {
        display: block;
        font-size: 15px;
        margin-bottom: 4px;
    }

    .card span {
        color: #52606d;
    }

    code {
        font-family: Consolas, "Cascadia Mono", monospace;
        font-size: 12px;
    }
</style>
</head>
<body>
<main>
    <h1>自動化ジョブ用 Mock <span class="mock-badge">MOCK</span></h1>
    <p class="lead">実在の管理画面の代わりに、各ジョブのDOM契約を満たす画面を返します。データはすべて架空です。</p>

    <a class="card" href="example-security/">
        <strong>ExampleSecurity Cloud Service（センサー / デバイス一覧）</strong>
        <span>週次ジョブ <code>WeeklyScanTargetSync</code> の操作対象。CSV出力と、手動スキャン対象チェックの整合を確認できます。</span>
    </a>

    <a class="card" href="example-asset/">
        <strong>ExampleAsset（端末一覧）</strong>
        <span>月次ジョブ <code>MonthlyInstallReport</code> の操作対象。端末ごとのインストール済みアプリCSVを出力できます。</span>
    </a>
</main>
</body>
</html>
